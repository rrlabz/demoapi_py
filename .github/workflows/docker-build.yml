name: Build Docker image

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Read app version
        id: app-version
        run: |
          version="$(tr -d '[:space:]' < version.info)"
          if [ -z "$version" ]; then
            echo "version.info is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.app-version.outputs.version }}

      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: List Docker image labels
        if: github.event_name == 'pull_request'
        run: |
          docker image inspect "ghcr.io/${{ github.repository }}:${{ steps.app-version.outputs.version }}" \
            --format '{{range $key, $value := .Config.Labels}}{{$key}}={{$value}}{{println}}{{end}}'

      - name: Verify pushed Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ steps.app-version.outputs.version }}"

      - name: List Docker images
        if: github.event_name == 'pull_request'
        run: docker image ls
